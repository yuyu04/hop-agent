acceptance_criteria:
  - id: AC-ccd24bee
    ears: ubiquitous
    text: "The system shall 파일(새로·열기·최근·저장·다른 이름으로·PDF·인쇄)과 편집(오려두기·복사·붙이기) 명령을 HOP 구현으로 바꿔 끼워 등록하고, 명령 ID와 단축키가 겹치지 않으며 화면의 모든 data-cmd가 등록된 명령을 가리킨다."
    test_refs:
      - apps/studio-host/src/command/commands/file.test.ts
      - apps/studio-host/src/command/commands/edit.test.ts
      - apps/studio-host/src/command/replace-upstream-commands.test.ts
  - id: AC-dca9f014
    ears: ubiquitous
    text: "The system shall 데스크톱 문서 수명주기(열기 대기열·최근 문서·여러 창·저장 안 한 문서 종료 확인)를 네이티브에서 관리하고, 프런트는 문서 파일 입출력을 청크로 주고받는다."
    test_refs:
      - apps/desktop/src-tauri/src/pending_open.rs
      - apps/desktop/src-tauri/src/recent_documents.rs
      - apps/desktop/src-tauri/src/windows.rs
      - apps/desktop/src-tauri/src/app_quit.rs
      - apps/studio-host/src/core/document-files.test.ts
      - apps/studio-host/src/core/chunked-fs.test.ts
      - apps/studio-host/src/core/desktop-events.test.ts
  - id: AC-48d94ed9
    ears: ubiquitous
    text: "The system shall 문서 작성용 글꼴을 번들 카탈로그와 로컬 글꼴에서 찾아 쓰고, PDF로 내보낼 때 한글 글꼴이 없으면 번들 대체 글꼴로 채운다."
    test_refs:
      - apps/desktop/src-tauri/src/font_catalog.rs
      - apps/desktop/src-tauri/src/pdf_export.rs
      - apps/desktop/src-tauri/src/pdf_font_fallbacks.rs
      - apps/studio-host/src/core/font-loader.test.ts
      - apps/studio-host/src/core/local-fonts.test.ts
      - apps/studio-host/src/core/font-authoring-policy.test.ts
  - id: AC-12dd23f0
    ears: event
    condition: "When HWP를 저장할 때"
    text: "The system shall 줄 배치(PARA_LINE_SEG) 세로 위치를 포맷 표준인 쪽 기준으로 보정해 2쪽 이상 문서가 다른 뷰어에서 겹쳐 보이지 않게 한다."
    test_refs:
      - apps/desktop/src-tauri/src/hwp_lineseg_fix.rs
  - id: AC-d74b20a6
    ears: ubiquitous
    text: "The system shall macOS Finder의 HWP/HWPX 미리보기·썸네일을 Quick Look 확장으로 제공한다."
    test_refs:
      - apps/desktop/quicklook/rust/src/tests.rs
  - id: AC-daf3dc41
    ears: ubiquitous
    text: "The system shall rhwp를 어댑터(데스크톱)와 포트(스튜디오)로만 쓰고, 고정한 rhwp 커밋·WASM 산출물·오버라이드 기준선이 서로 맞는지 검사한다."
    test_refs:
      - tests/rhwp-boundary.test.mjs
      - tests/rhwp-baseline.test.mjs
      - tests/update-upstream.test.mjs
  - id: AC-26f6acf4
    ears: ubiquitous
    text: "The system shall 앱 셸 UI(인쇄·대화상자·사용자 지정 선택 상자·툴바·업데이트 알림)를 앱 테마에 맞춰 보이고, 데스크톱 플랫폼을 판별해 단축키 표기와 창 장식을 맞춘다."
    test_refs:
      - apps/studio-host/src/ui/print-dialog.test.ts
      - apps/studio-host/src/ui/dialog.test.ts
      - apps/studio-host/src/ui/custom-select.test.ts
