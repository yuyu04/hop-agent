id: F-46554fae
slug: docx-image-into-cell
title: "docx 본문 이미지를 HWP 본문 셀에 삽입 — clone_table.body_images + insertPictureInCell 배선 (Phase B-3)"
status: done
modules:
  - apps/studio-host/src/core/ai-apply.ts
  - apps/studio-host/src/core/ai-bridge.ts
acceptance_criteria:
  - id: AC-1d9d34db
    ears: event
    condition: "When 항목에 본문 이미지가 있으면"
    text: "The system shall buildFormFillMapping이 그 이미지를 본문 통셀 좌표(resolveBodyCell row/col)와 함께 bodyImages로 매핑하고, buildFormFillEdits가 clone_table.body_images로 싫는다."
    test_refs: ["apps/studio-host/src/core/docx-image-into-cell.test.ts"]
    notes: "Phase B-1이 docx 그림 9개를 EntryRecord.images로 추출. entryRecordToFormFillEntry가 images를 FormFillEntry로 옮기고, buildFormFillMapping이 resolveBodyCell로 본문 셀 좌표를 잡아 bodyImages로 만든다."
  - id: AC-d75fce39
    ears: event
    condition: "When cloneTableAt이 body_images를 가진 clone_table을 적용할 때"
    text: "The system shall 셀 텍스트를 채운 뒤 각 이미지를 해당 본문 셀의 after_para 위치에 insertPictureInCell로 삽입한다 — 인덱스 밀림 방지를 위해 after_para 내림차순으로 넣고 그림 폭은 본문폭 상한으로 제한한다."
    test_refs: ["apps/studio-host/src/core/docx-image-into-cell.test.ts"]
    notes: "cloneTableAt: cell_fills 채운 뒤 spec.body_images를 (row,col) cellIdx로 찾아 base64를 바이트로 디코딩, insertPictureInCell 호출. px*75=HWPUNIT, 셀 폭 98% 목표(확대는 원본 4배 상한). 높이는 rhwp 네이티브(insert_picture_in_cell_native)가 셀 높이 60% 상한으로 비율 축소 — 30% 상한은 일반 가로 그림까지 축소하는 회귀였음(2026-07 실측). insertPictureInCell은 rhwp 포크(B-2)의 셀 그림 API — 없는 환경이면 생략(WasmEditing 선택 메서드)."
  - id: AC-4a433033
    ears: unwanted
    condition: "If 항목에 이미지가 없거나 본문 셀을 못 찾으면"
    text: "The system shall body_images를 비워 기존 텍스트 채우기·복제 동작을 그대로 유지한다(회귀 없음)."
    test_refs: ["apps/studio-host/src/core/docx-image-into-cell.test.ts"]
    notes: "images 없는 항목은 bodyImages=[] → body_images undefined → cloneTableAt 이미지 루프 안 탄. 기존 form-fill 테스트 GREEN 유지."
