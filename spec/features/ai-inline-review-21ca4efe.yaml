    text: "The system shall 변경마다 오른쪽 여백에 작은 승인/거절 버튼을 두어, 거절하면 그 편집만 빼고 나머지를 다시 미리 적용하고, 승인하면 그 변경을 검토 완료로 표시한다(강조를 걷고 목록에 '승인' 표시). 모든 변경을 정하면 하나라도 남긴 경우 승인, 전부 거절한 경우 거절로 자동 마무리한다."
    test_refs:
      - apps/studio-host/src/ui/ai-inline-diff.test.ts
      - apps/studio-host/src/ui/agent-sidebar.test.ts
  - id: AC-30abfd1b
    ears: ubiquitous
    text: "The system shall 문서 뷰 아래쪽에 '변경 i / N' 탐색 바(이전·다음, 지금 변경 거절·승인, 모두 거절·모두 승인)를 띄우고, 이전·다음은 해당 변경 위치로 스크롤하며, 지금 변경을 정하면 다음 변경을 가리킨다."
    test_refs:
