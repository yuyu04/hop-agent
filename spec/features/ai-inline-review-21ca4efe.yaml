    ears: ubiquitous
    text: "The system shall 미리 적용 결과의 각 변경 문단에 원래 편집 번호를 실어(applyActionScript changed[].editIndex), 개별 제외로 일부만 다시 적용해도 원래 편집과 짝이 맞게 한다."
