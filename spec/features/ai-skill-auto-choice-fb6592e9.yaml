acceptance_criteria:
  - id: AC-cee73e04
    ears: event
    condition: "When 스킬이 '자동'(기본값)이고 사용자가 편집 모드로 지시를 보낼 때"
    text: "The system shall 사용자가 스킬을 고르지 않아도 되도록, 모든 스킬의 이름·설명·지침을 '작성 지침 목록'으로 요청 앞에 붙여 AI가 요청 내용과 문서 상태에 맞는 지침 하나(필요하면 문체 지침과 함께)를 골라 따르게 한다. 목록은 낱말 일치 점수가 높은 순서로 싣고 첫머리에 '낱말 기준 추천'을 참고로 적으며, 편집 전용 스킬(mode: edit)에는 '기존 문서 편집 전용' 표시를 붙인다. 질문 모드는 글을 쓰지 않으므로 목록을 싣지 않는다."
    test_refs:
      - apps/studio-host/src/core/skill-select.test.ts
    notes: |
      ## Why
      2026-10-08 사용자: "사용자가 자기가 하는 일에 스킬들을 골라야 하나? 스스로 못하겠지?" — 고르는 주체를 AI로.
      낱말 일치만으로는 '회의 결과를 관계기관에 보낼 문서로 만들어줘'(실제로는 공문)처럼 단어가 없는 요청을 놓친다.
  - id: AC-a0f16fb6
    ears: event
    condition: "When 스킬 지침 본문의 합이 상한(16,000자)을 넘을 때"
    text: "The system shall 점수 순서대로 상한 안에 드는 스킬까지만 본문을 싣고, 나머지는 이름·설명만 목록에 남긴다."
    test_refs:
      - apps/studio-host/src/core/skill-select.test.ts
  - id: AC-ae417d5d
    ears: ubiquitous
    text: "The system shall Action Script 응답 형식에 선택 항목 skill(따른 지침의 이름, 없으면 빈 문자열)을 두고, 시스템 프롬프트에서 작성 지침 목록이 있으면 하나를 골라 따르고 그 이름을 skill에 적게 하며, 검증·잘림 복구를 거쳐도 skill 값이 프런트엔드까지 전달된다."
    test_refs:
      - apps/desktop/src-tauri/src/ai/schema.rs
      - apps/desktop/src-tauri/src/ai/mod.rs
  - id: AC-fe6c5691
    ears: event
    condition: "When AI 응답이 도착했을 때 적용된 지침이 있으면"
    text: "The system shall 답변에 '지침: <이름> · AI 선택'(사용자가 직접 고른 경우 '· 직접 선택') 표시를 붙이고, 응답의 skill이 알려진 스킬 이름이 아니면 표시하지 않으며, 표시를 누르면 입력창의 글을 지우지 않고 스킬을 바꿀 수 있는 '/' 메뉴를 연다."
    test_refs:
      - apps/studio-host/src/ui/agent-sidebar-skill.test.ts
  - id: AC-f4d79af6
    ears: ubiquitous
    text: "The system shall 스킬 선택 상자의 기본값을 '스킬: 자동(AI 선택)'으로 보여, 평소에는 고를 필요가 없고 직접 만든 스킬을 강제로 쓰거나 끌 때만 쓰는 고급 설정임을 드러낸다."
    test_refs:
      - apps/studio-host/src/ui/agent-sidebar-skill.test.ts
