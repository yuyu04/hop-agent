id: F-beb35fbb
slug: docx-batch-form-fill
title: "연구노트 docx 일괄 변환 — 파싱된 N개 항목을 LLM 없이 엔트리 양식에 결정적 복제·채움"
status: done
modules:
  - apps/studio-host/src/core/ai-apply.ts
  - apps/studio-host/src/core/ai-bridge.ts
  - apps/studio-host/src/core/tauri-bridge.ts
  - apps/studio-host/src/ui/agent-sidebar.ts
  - apps/desktop/src-tauri/src/ai/mod.rs
  - apps/desktop/src-tauri/src/lib.rs
acceptance_criteria:
  - id: AC-262d6d09
    ears: event
    condition: "When 사용자가 연구노트형 docx를 첨부하고 양식 일괄 변환을 요청하면"
    text: "The system shall LLM 호출 없이 docx에서 파싱된 각 항목(EntryRecord)을 양식 항목(FormFillEntry)으로 변환해 항목마다 엔트리 양식 표를 결정적으로 복제·채운다 — 내용은 docx에서 직접 온다(AI 응답 왕복 없음)."
    test_refs: ["apps/studio-host/src/core/docx-batch-form-fill.test.ts"]
    notes: "## Why\n2026-06-22 실측: 45개 항목을 단일 LLM form_fill로 밀어넣으니 결과 HWP가 원본 동일(표 10개, +512B) — 0개 복제. 내용은 이미 parse_docx_structure가 45/45 추출하므로 LLM 왕복이 불필요하고, 해로워이 되는(토큰 잘림/환각) 경로다.\n## Decision\nRust에 ai_parse_research_note_docx(path) 커맨드를 추가해 ResearchNoteDoc(serde JSON)를 프론트로 노출(기존 ai_extract_text 파일 읽기 패턴 재사용). agent-sidebar의 runFormFill이 연구노트 docx 첨부가 있으면 결정적 경로(runDocxFormFill)로 분기: 파싱→매핑→엔트리 양식 선택→buildFormFillEdits(F-4d5d3e00 body 포함)→applyActionScript. AI 경로는 그대로 폴백.\n## Depends\nF-075bdb05(docx 구조 파싱), F-4d5d3e00(본문 통셀 채우기), F-ae778890(복제 루프)."
  - id: AC-5bc13234
    ears: ubiquitous
    text: "The system shall EntryRecord를 FormFillEntry로 매핑한다 — title→'제목', recorders(쉰표로 결합)→'기록자', confirmer→'확인자', record_date→'기록 일자', confirm_date→'확인 일자', body_paragraphs→body."
    test_refs: ["apps/studio-host/src/core/docx-batch-form-fill.test.ts"]
    notes: "## Decision\nentryRecordToFormFillEntry(rec): FormFillEntry — 순수 함수(단위 테스트 가능). 라벨명은 HWP 엔트리 양식(표#10)의 메타 라벨과 일치: 제목/기록자/확인자/기록 일자/확인 일자. body_paragraphs는 body로 넘겨 F-4d5d3e00 본문 통셀 채우기가 단락별로 푸는다."
  - id: AC-d4d08e14
    ears: ubiquitous
    text: "The system shall 복제 소스로 '엔트리 양식 표'를 선택한다 — form_tables 중 셀에 '기록자'와 '기록 일자'(또는 '제목') 라벨을 함께 가진 표(반복 항목 템플릿). 대외비/목차/개요 등 다른 표는 고르지 않는다."
    test_refs: ["apps/studio-host/src/core/docx-batch-form-fill.test.ts"]
    notes: "## Why\n기존 pickSourceFormTable은 tables[0]를 골라 연구노트에서는 대외비 표(표#1)를 잡는다 — 엔트리 양식(표#10)을 못 찾는다. '4페이지 양식' = 제목+기록자+일자 라벨을 가진 반복 템플릿 표다.\n## Decision\npickEntryFormTable(tables): FormSourceTable|null — 정규화 라벨 매칭('기록자' && ('기록 일자' || '제목')). 순수 함수(단위 테스트 가능)."
  - id: AC-9e3c4903
    ears: unwanted
    condition: "If docx에서 연구노트 항목을 추출하지 못하거나(항목 0개) 엔트리 양식 표를 찾지 못하면"
    text: "The system shall 변환을 거부하고 사유를 보고하며 문서를 변경하지 않는다 — 빈 결과를 성공으로 위장하지 않는다."
    test_refs: ["apps/studio-host/src/core/docx-batch-form-fill.test.ts"]
    notes: "## Why\n이번 실패의 핵심은 '변환 0개인데 침묵'. pickEntryFormTable이 null이거나 entries=0이면 no-op + 명시 거부(F-ae778890 AC-0d49695d 거부 규약과 일관). entries=0 시 Rust parse_docx_structure가 이미 Err를 반환하므로 그 사유를 그대로 노출한다."
