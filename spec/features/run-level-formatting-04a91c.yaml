    text: "The system shall 서식 전용 액션을 텍스트 변경 없이 수행할 수 있게 한다 (REPLACE 없이 style-only)."
  - id: AC-264bfd
    ears: event
    condition: "When 사용자가 텍스트를 드래그 선택하고 서식 변경을 요청하면"
    text: "The system shall 선택 영역을 대상 범위로 사용하여 서식을 적용한다."
  - id: AC-57d574
    ears: unwanted
    condition: "If 대상 문자열이 문단에서 유일하게 매칭되지 않으면"
    text: "The system shall 적용을 건너뛰고 사유를 메시지로 알린다."
