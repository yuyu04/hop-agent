id: F-4d5d3e00
slug: form-body-block-fill
title: "양식 본문 통셀 채움 — 라벨 없는 전폭 셀에 멀티단락 본문을 결정적으로 주입"
status: done
modules:
  - apps/studio-host/src/core/ai-apply.ts
acceptance_criteria:
  - id: AC-b8ccc308
    ears: event
    condition: "When 양식 항목에 멀티단락 본문 블록(body)이 포함되면"
    text: "The system shall 그 본문을 양식 표의 '본문 통셀'에 채우되, 소스 단락 1개를 셀 문단 1개로 보존한다 — 여러 단락을 한 줄로 평탄화하지 않는다."
    test_refs: ["apps/studio-host/src/core/form-body-block-fill.test.ts"]
    notes: "## Why\n연구노트 4페이지 양식의 핵심은 제목·기록자·일자 같은 라벨→값 칸이 아니라, 그 사이의 '본문 통셀'(표#10의 (1,0), 전폭 1×3 병합)이다. 이 셀에는 인접 라벨이 없어 기존 라벨→값칸 매핑(F-ae778890 AC-86e329eb)으로는 절대 채워지지 않는다 — 그래서 실측에서 본문(엔트리당 ~20단락, Ÿ/1./–/□① 계층)이 통째로 누락됐다(결과 HWP 표 10개=원본 동일, +512B).\n## Decision\nFormFillEntry에 선택 필드 body: string[]를 추가하고, buildFormFillMapping이 본문 통셀 좌표를 찾아 cell_fill {row,col, text: body.join('\\n')}로 emit한다. 채움 메커니즘은 기존 cloneTableAt→splitLines→fillCellLinesFlat(F-466f8e 다줄 경로)를 그대로 재사용하므로 단락별 셀 문단이 보존된다(평탄화 없음).\n## Depends\nF-466f8e(다줄 셀 채우기), F-ae778890(form_fill 매핑/복제 루프)."
  - id: AC-51906c63
    ears: ubiquitous
    text: "The system shall 본문 통셀을 결정적으로 식별한다 — 한 행에 col=0 셀 하나만 존재하고(전폭 병합 셀은 대표 좌표 1개로만 노출됨) 그 셀의 텍스트가 알려진 메타 라벨(제목/기록자/확인자/기록 일자/확인 일자) 집합에 속하지 않는 셀."
    test_refs: ["apps/studio-host/src/core/form-body-block-fill.test.ts"]
    notes: "## Why\nserialize.rs FormCell은 span을 노출하지 않지만, 병합 셀은 대표(좌상단) 좌표 1개로만 cells에 들어온다(collect_form_tables). 따라서 '그 행에 셀이 1개뿐 + col=0'이면 전폭 병합 행이고, 메타 라벨이 아니면 본문 통셀이다 — 라벨/값 행(제목 2칸, 기록자 2칸)은 셀이 2개라 자연히 배제된다.\n## Decision\nresolveBodyCell(table, metaLabels): {row,col}|null. 정규화(공백/대소문자 무시)는 normalizeLabel을 재사용. 후보가 여럿이면 문서 순서(최소 row) 첫 셀을 본문으로 본다."
  - id: AC-fee48dae
    ears: unwanted
    condition: "If 본문 블록이 있는데 본문 통셀을 식별하지 못하면"
    text: "The system shall 본문을 조용히 버리지 않고 사유와 함께 skipped 목록에 기록한다(error-as-data)."
    test_refs: ["apps/studio-host/src/core/form-body-block-fill.test.ts"]
    notes: "## Why\n현재 파이프라인의 가장 큰 실패는 '변환이 사실상 0인데 침묵'한 것이다. 본문은 엔트리 내용의 대부분이므로, 채울 자리를 못 찾으면 반드시 skipped{label:'(본문)', reason}로 드러내 사용자가 양식/매핑 문제를 인지하게 한다. 빈 양식을 성공으로 위장하지 않는다."
  - id: AC-ad756684
    ears: ubiquitous
    text: "The system shall 기존 라벨→값칸 매핑(F-ae778890 AC-86e329eb)을 회귀 없이 유지한다 — body가 없는 항목의 cellFills/skipped 결과는 본 변경 전과 동일하다."
    test_refs: ["apps/studio-host/src/core/form-body-block-fill.test.ts"]
    notes: "## Decision\nbody는 선택 필드다. entry.body가 비었거나 없으면 기존 buildFormFillMapping 동작이 그대로다(본문 cell_fill 추가 없음). 본문 cell_fill은 라벨→값칸 매핑 뒤에 덧붙으며 usedValueCells 중복 가드를 공유해 값칸과 충돌하지 않는다."
