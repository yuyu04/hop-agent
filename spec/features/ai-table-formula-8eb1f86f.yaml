  - apps/studio-host/src/core/ai-bridge.ts
  - apps/studio-host/src/core/ai-apply.ts
acceptance_criteria:
  - id: AC-32888b59
    ears: event
    condition: "When AI가 payload.type=\"table_formula\"인 편집을 표 안 셀 ID로 낼 때"
    text: "The system shall rhwp 표 계산 엔진으로 formula를 평가해 결과를 대상 셀(row,col)에 기입한다 — AI가 암산한 숫자를 글자로 넣지 않는다."
    test_refs: ["apps/studio-host/src/core/ai-table-formula.test.ts", "apps/desktop/src-tauri/src/ai/schema.rs"]
    notes: "## Why\n2026-07-27 실측: evaluateTableFormula가 엔진에 있는데 AI 경로 호출 0건이라 \"합계 칸 계산해줘\" 요청에 LLM이 암산한 값을 문자열로 넣었다 — 틀리기 쉽고 원본 값이 바뀌어도 갱신되지 않는다.\n## Decision\n새 payload type \"table_formula\"(구조 편집이 아니라 table_edit과 분리). target_id는 그 표 안의 셀 ID. write_result=true 고정 — 계산만 하고 안 쓰는 건 편집이 아니라 질의라 이 경로에 없다.\n## 좌표 체계 주의\nrow/col은 0-기준 정수(다른 table 편집과 동일)이지만 formula 안의 셀 참조는 A1 표기다. 스키마 description에 명시해 모델 혼동을 막는다."
  - id: AC-c420a20e
    ears: unwanted
    condition: "If formula가 비었거나 row/col이 없거나 중첩 표이거나 엔진이 수식을 평가하지 못하면"
    text: "The system shall 표를 변경하지 않고 사유를 skipped로 보고한다 — 잘못된 값을 썰다 넣지 않는다."
    test_refs: ["apps/studio-host/src/core/ai-table-formula.test.ts"]
    notes: "엔진은 평가 실패 시 Err를 던져 WasmBridge가 throw한다 → applyActionScript가 skipped로 잡는다. ok=false JSON을 돌려주는 경우도 방어적으로 사유 보고."
  - id: AC-3f7ca215
    ears: state
    condition: "While 같은 스크립트에 그 표의 셀 채움·행 추가 편집이 함께 있는 동안"
    text: "The system shall 계산식을 그 편집들보다 나중에 적용한다 — 먼저 계산하면 낡은 값을 합산하기 때문이다. 계산식이 여러 개면 입력 정순으로 적용한다."
    test_refs: ["apps/studio-host/src/core/ai-table-formula.test.ts"]
    notes: "\"합계 행 추가하고 합계 계산해줘\"가 정상 동작하려면 순서가 고정돼야 한다. 정렬 비교자에서 계산식을 같은 위치의 뒤로 보낸다(table_edit이 입력 정순인 것과 같은 이유)."
