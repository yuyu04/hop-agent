id: F-c166cf
slug: format-aware-compose
title: "서식 인식 작성 — 기존 문서 서식을 직접 보고 복제해 넣기"
status: done
modules:
  - apps/desktop/src-tauri/src/ai/serialize.rs
  - apps/desktop/src-tauri/src/ai/schema.rs
  - apps/desktop/src-tauri/src/ai/mod.rs
  - apps/studio-host/src/core/ai-apply.ts
  - apps/studio-host/src/core/ai-bridge.ts
acceptance_criteria:
  - id: AC-a0d6f6
    ears: ubiquitous
    text: "The system shall 직렬화 시 본문 문단에 실제 서식 요약(글자 크기 pt·굵기·특수 정렬)을 함께 제공하여 AI가 기존 문서의 서식을 알 수 있게 한다."
    notes: "ContentNode.fmt — get_char_properties_at_native(fontSize/bold) + get_para_properties_at_native(alignment)에서 '14pt 굵게 가운데' 형태로 요약. 평범한 본문(10pt 보통 양쪽정렬)은 생략해 토큰 절약. 스타일 이름은 DocumentCore native 부재로 제외(글자/문단 서식 요약으로 대체)."
    test_refs:
      - apps/desktop/src-tauri/src/ai/serialize.rs
  - id: AC-cdf793
    ears: event
    condition: "When AI가 INSERT/REPLACE에 payload.copy_format_from(참조 문단 ID)을 지정하면"
    text: "The system shall 그 참조 문단의 스타일·글자 서식·문단 서식을 읽어 새 문단에 그대로 복제한다(테마 수치 대신)."
    notes: "ai-apply copyFormatFrom: ① getStyleAt→id>0이면 applyStyle(Ctrl+숫자식 일괄) ② getCharPropertiesAt→복제 가능 키(bold/italic/underline/strikethrough/fontSize/textColor; 단위·이름 동일) applyCharFormat ③ getParaPropertiesAt→정렬·줄간격만(간격/여백은 읽기 px·쓰기 저장스케일로 단위 달라 제외) applyParaFormat. 본문 참조만 지원(셀 참조는 폴백). copy_format_from이 테마 style보다 우선."
    test_refs:
      - apps/studio-host/src/core/ai-apply.test.ts
  - id: AC-da9b67
    ears: event
    condition: "When 사용자가 기존 문서를 바탕으로 이어 쓰기를 요청하면"
    text: "The system shall 시스템 프롬프트가 가장 비슷한 기존 문단을 copy_format_from으로 지정해 서식을 맞추도록 유도한다."
    notes: "system_prompt [기존 문서 서식 따라가기] 절: 새 문단마다 같은 종류 기존 본문 문단 ID를 copy_format_from으로, 기존 디자인 살릴 때 style(테마)보다 우선."
    test_refs:
      - apps/desktop/src-tauri/src/ai/mod.rs
  - id: AC-a89ceb
    ears: unwanted
    condition: "If copy_format_from이 가리키는 문단을 찾지 못하면"
    text: "The system shall 서식 복제를 건너뛰고 기존 테마/기본 서식으로 폴백한다(텍스트는 그대로 적용)."
    notes: "copyFormatFrom이 false 반환(셀 참조·읽기 실패) 시 applyParaStyle(테마)로 폴백. 텍스트 삽입은 서식과 독립적으로 이미 완료."
    test_refs:
      - apps/studio-host/src/core/ai-apply.test.ts
