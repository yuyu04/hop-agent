id: F-9dbe7a25
slug: keyless-provider-guidance
title: "API 키 줄이 어느 provider 것인지 밝히고, 키 없이 쓰는 길(로컬 CLI)을 안내한다"
status: done
modules:
  - apps/studio-host/src/styles/agent-sidebar.css
  - apps/studio-host/src/ui/agent-sidebar.ts
acceptance_criteria:
  - id: AC-976886ef
    ears: state
    condition: "While 설정 모달에 API 키 줄이 보이는 동안"
    text: "The system shall 그 키가 어느 provider의 것인지 라벨로 밝힌다 — 출처 없는 키를 요구하지 않는다."
    test_refs:
      - apps/studio-host/src/ui/agent-sidebar.test.ts
    notes: |
      ## Why
      2026-08-03 사용자 스크린샷: ⚙ Agent 설정에 'API 키' 입력칸과 '키 없음'만 떠 있어
      어느 provider용 키인지 알 수 없었고, 팀 플랜 사용자는 발급할 필요도 없는 키를
      요구받는 것처럼 보였다. provider 선택은 컴포저 하단에 있어 모달에서는 안 보인다.
      ## Decision
      모달에 provider select를 하나 더 두면 상태가 두 곳으로 갈린다. 대신 키 줄에
      provider 이름 라벨을 붙여 컴포저의 선택을 그대로 비춘다(단일 출처 유지).
  - id: AC-406b4d54
    ears: state
    condition: "While 키가 필요한 provider가 선택돼 있고 저장된 키가 없는 동안"
    text: "The system shall 키 없이 쓰는 대안과 로컬 Claude Code CLI provider로 한 번에 전환하는 버튼을 보여준다 — 구독 플랜(팀·Pro)에서는 키 발급이 불필요하다."
    test_refs:
      - apps/studio-host/src/ui/agent-sidebar.test.ts
    notes: |
      전환 버튼은 컴포저의 provider select 값을 바꾸고 기존 provider 변경 경로를 그대로
      태운다 — 모델 목록·키 줄 갱신이 한 곳에서만 일어나게 한다.
  - id: AC-6ee49041
    ears: unwanted
    condition: "If 키가 이미 저장돼 있거나 키가 필요 없는 provider면"
    text: "The system shall 키 없는 대안 안내를 띄우지 않는다 — 문제가 없을 때 설정 패널을 조용히 둔다."
    test_refs:
      - apps/studio-host/src/ui/agent-sidebar.test.ts
  - id: AC-4f0e0982
    ears: ubiquitous
    text: "The system shall 키 줄을 라벨·입력·동작 버튼 묶음으로 나눠 좁은 설정 모달에서 잘리지 않고 줄바꿈되게 배치한다."
    test_refs:
      - apps/studio-host/src/ui/agent-sidebar.test.ts
    notes: |
      스크린샷에서 '키 저장 / 삭 제 / 키 없음'이 320px 모달 폭에 뭉개졌다. 버튼을
      .hop-ai-key-actions 묶음으로 분리하고 키 줄을 flex-wrap으로 둔다.
