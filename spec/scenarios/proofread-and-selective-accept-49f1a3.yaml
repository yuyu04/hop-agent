slug: proofread-and-selective-accept
title: "문서 교정 후 선택적 수락 (Copilot 핵심 여정)"
flow: "사용자가 작성 중인 HWP 보고서를 열고 AI 사이드바에서 \"문서 전체 교정해줘\"를 실행한다. 시스템이 본문과 표 셀 전체를 스캔해 맞춤법·어색한 문장·일관성 이슈 목록을 사이드바에 표시한다. 사용자가 이슈를 클릭하면 해당 문단으로 점프하고 하이라이트된다. AI가 제안한 여러 수정(edit)이 diff로 표시되면, 사용자는 각 변경 블록 옆의 ✓/✗으로 마음에 드는 수정만 개별 수락하고 나머지는 거절한다. 수락된 수정만 WASM 프리미티브로 적용되고 문서가 dirty 표시된다. 이어서 \"목차 만들어줘\"를 요청하면 휴리스틱으로 추정된 헤딩 구조로 목차가 문서 앞에 삽입된다. 저장 후 한컴오피스에서 열어도 구조가 깨지지 않는다."
